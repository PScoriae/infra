name: Tokyo Drift Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency: tofu-drift

jobs:
  get-tofu-directories:
    outputs:
      TFDIRS: ${{ steps.get-tf-dirs.outputs.TFDIRS }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get list of directories with Tofu
        id: get-tf-dirs
        run: |
          TFDIRS=$(find . -type f -name "*.tf" ! -path "*/modules/*" ! -path "*/gcp/*" -exec dirname {} \; | sort -u)
          echo "List of Tofu directories"
          echo "$TFDIRS"
          # Convert into JSON array
          FMT_TFDIRS=$(echo "$TFDIRS" | jq -R -s -c 'split("\n")[:-1]')
          echo "TFDIRS=$FMT_TFDIRS" >> $GITHUB_OUTPUT

  check-drift:
    needs: get-tofu-directories
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        tf-dir: ${{ fromJSON(needs.get-tofu-directories.outputs.TFDIRS) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Tofu
        uses: ./.github/actions/tofu-setup
        with:
          aws-role: ${{ secrets.AWS_GHA_ROLE }}
          github-token: ${{ secrets.TOFU_GITHUB_TOKEN }}

      - name: Check drift in Tofu directories
        id: tf-plan
        working-directory: ${{ matrix.tf-dir }}
        run: |
          tofu init -input=false
          EXITCODE=0
          tofu plan -detailed-exitcode -no-color -input=false -out "$RUNNER_TEMP/tfplan" || EXITCODE=$?
          echo "EXITCODE=$EXITCODE" >> $GITHUB_ENV
          [ $EXITCODE -ne 1 ] || { echo "Tofu Plan Failed!"; exit 1; }

      # Create string output of Tofu Plan
      - name: Create String Output
        id: tf-plan-string
        working-directory: ${{ matrix.tf-dir }}
        run: |
          # shortcut: truncates to stay under GitHub's 65536-char issue body limit; full plan is in the run log
          TOFU_PLAN=$(tofu show -no-color "$RUNNER_TEMP/tfplan" | head -c 60000)

          delimiter="$(openssl rand -hex 8)"
          echo "summary<<${delimiter}" >> $GITHUB_OUTPUT
          echo "## Tofu Plan Output" >> $GITHUB_OUTPUT
          echo "<details><summary>Click to expand</summary>" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```tofu' >> $GITHUB_OUTPUT
          echo "$TOFU_PLAN" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "</details>" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Reconcile:** add \`drift:revert\` to apply the code over reality (needs approval on the \`prod\` environment), or \`drift:accept\` to have Claude open a PR that updates the code to match reality." >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      # Publish Terraform Plan as task summary
      - name: Publish Terraform Plan to Task Summary
        env:
          SUMMARY: ${{ steps.tf-plan-string.outputs.summary }}
        run: |
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      # If changes are detected, create a new issue
      - name: Publish Drift Report
        if: env.EXITCODE == 2
        uses: actions/github-script@v7
        env:
          SUMMARY: "${{ steps.tf-plan-string.outputs.summary }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `${process.env.SUMMARY}`;
            const title = 'Tofu Drift Detected | ${{ matrix.tf-dir }}';
            const creator = 'github-actions[bot]'

            // Look to see if there is an existing drift issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: creator
            })
            const issue = issues.data.find(i => i.title === title)

            if( issue ) {
              if ( issue.body == body ) {
                console.log('Drift Detected: Found matching issue with duplicate content')
              } else {
                console.log('Drift Detected: Found matching issue, updating body')
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: body
                })
              }
            } else {
              console.log('Drift Detected: Creating new issue')

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body
              })
            }

      # If changes aren't detected, close any open drift issues
      - name: Close Drift Report
        if: env.EXITCODE == 0
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Tofu Drift Detected | ${{ matrix.tf-dir }}';
            const creator = 'github-actions[bot]'

            // Look to see if there is an existing drift issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: creator
            })
            const issue = issues.data.find(i => i.title === title)

            if( issue ) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              })
            }

      # Mark the workflow as failed if drift detected
      - name: Error on Failure
        if: env.EXITCODE == 2
        run: exit 1
